[project]
name = "openwater"
version = "0.1.0"
description = "Software voor preventie van gokverslaving — 9 modules, pure Python (clean → sort → features → model → rapport)."
readme = "README_organisatie.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "python-dateutil>=2.8",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "optuna>=3.4",
    "pyyaml>=6.0",
    "imbalanced-learn>=0.12",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.poetry]
# Non-package modus: de stapmappen heten 1_cleaning, 2_sorting, ... — geen geldige Python-
# package-namen, dus we bouwen geen installeerbaar wiel. Poetry beheert hier alleen de
# virtuele omgeving + dependencies; je draait de pijplijn met `poetry run python run_pipeline.py`.
package-mode = false
